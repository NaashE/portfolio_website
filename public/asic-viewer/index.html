<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>ASIC viewer</title>
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet' type='text/css'>
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            font-size: 12px;
        }

        .textShadow {
            text-shadow:
            -1px -1px 0 #202020,
             0   -1px 0 #202020,
             1px -1px 0 #202020,
             1px  0   0 #202020,
             1px  1px 0 #202020,
             0    1px 0 #202020,
            -1px  1px 0 #202020,
            -1px  0   0 #202020;
        }
        
        /* Styled to match the redesigned site's "loading model…" state
           (ModelViewer.tsx / model-viewer.css): monospace, uppercase,
           sky-blue, animated trailing dots. */
        #loadingStatus {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            white-space: nowrap;
            font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(166, 191, 230, 0.75);
        }

        /* The #loadingStatus ID selector above out-specifies the browser's
           default `[hidden] { display: none }` rule, so once loading
           finishes and JS sets `loadingStatus.hidden = true`, the element
           would otherwise stay visible. Re-assert display:none here with
           matching (id + attribute) specificity. */
        #loadingStatus[hidden] {
            display: none;
        }

        #loadingStatus.is-loading::after {
            content: "...";
            display: inline-block;
            overflow: hidden;
            width: 0;
            margin-left: 2px;
            vertical-align: bottom;
            animation: loadingDots 1.2s steps(3, end) infinite;
        }

        @keyframes loadingDots {
            /* 3ch = width of 3 monospace characters (the "ch" unit is defined
               as one character's advance width, exact for monospace fonts —
               unlike an em guess, this can't under-measure and clip a dot).
               +0.3em covers the letter-spacing gaps between/after them. */
            from { width: 0; }
            to { width: calc(3ch + 0.3em); }
        }

        #dropZone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 200px;
            border: 2px dashed #666;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #dropZone.hidden {
            display: none;
        }
        #dropZone.dragover {
            border-color: #fff;
            background: rgba(0, 0, 0, 0.7);
        }

        #crossSection {
            position: absolute;
            bottom: 0;
            left: 0;
            margin-left: 10px;
            margin-bottom: 10px;
        }

        #instanceClassTitle {
            font-size: large;
        }

        #information {
            font-size: small;
        }

        .lil-gui { 
            /* --folder-ident: 4; */
            --background-color: #181818;
            /* --widget-color: rgb(0, 89, 134); */
            /* --padding: 2px; */
        	--width: 300px;
	        /* --name-width: 65%; */
        }

        .selection_link a {
            color: white;
            cursor: pointer;
        }
            .lil-gui { display: none !important; }
        #crossSection { display: none !important; }
    </style>
  <script type="module" crossorigin src="./assets/index.7036b411.js"></script>
</head>

<body>

    <div id="crossSection"></div>
    <div id="loadingStatus" class="is-loading">Loading model</div>

    <div style="position: absolute; color:white; left: 5px; top: 5px; display:none;">
        <div id="instanceClassTitle" class="textShadow">DESIGN</div>
        <div id="information" class="textShadow"></div>
        <div class="textShadow"><br>KEYS
            <br>1: Hide Fill, Decap, Tap cells
            <br>2: Hide top cell geometry
            <br>3: Isolate selection / back
            <br>4: Zoom to selection
        </div>
        
    </div>

    <div id="dropZone" class="hidden">
        <div style="font-size: 18px; margin-bottom: 10px;">Drop GDS file here</div>
        <div style="font-size: 14px; opacity: 0.8;">or click to select</div>
    </div>

    
</body>

</html>
